services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: dashboard
      POSTGRES_PASSWORD: dashboard
      POSTGRES_USER: dashboard
    ports:
      - "5436:5432"
    volumes:
      - railway-postgres:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
volumes:
  railway-postgres:

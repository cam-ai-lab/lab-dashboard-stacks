<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Dynamic Dashboard Stack Lab</title><style>body{font-family:system-ui;max-width:1000px;margin:auto;padding:2rem;background:#f4f7fb;color:#172033}header{display:flex;justify-content:space-between}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:1rem;margin:2rem 0}article,form{background:#fff;padding:1rem;border-radius:12px}strong,small{display:block}strong{font-size:1.7rem;margin:.7rem 0}form{display:flex;gap:.5rem}input,button{padding:.7rem}button{background:#155eef;color:white;border:0}</style></head><body><header><div><h1>Dynamic Dashboard Stack Lab</h1><p>Firebase Hosting + Functions + Firestore</p></div></header><div class="grid" id="widgets"></div><button id="refresh">Refresh mock APIs</button> <a href="/api/config">Config status</a><form id="form"><input name="title" placeholder="Title" required><input name="value" placeholder="Value" required><input name="source" placeholder="Source" required><button>Add widget</button></form><script>const root=document.querySelector("#widgets");async function render(){const data=await fetch("/api/widgets").then(r=>r.json());root.replaceChildren(...data.map(w=>{const e=document.createElement("article");for(const [tag,text] of [["p",w.source],["h2",w.title],["strong",w.value],["small","Updated "+w.updatedAt]]){const n=document.createElement(tag);n.textContent=text;e.append(n)}return e}))}document.querySelector("#form").onsubmit=async e=>{e.preventDefault();await fetch("/api/widgets",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});e.target.reset();render()};document.querySelector("#refresh").onclick=async()=>{await fetch("/api/refresh",{method:"POST"});render()};render()</script></body></html>
